<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>코리아 트래블러</title>
<style>
  :root{
    --bg:#F6F1E7;
    --paper:#FFFCF5;
    --ink:#23283A;
    --ink-soft:#5B5747;
    --line:#DCD3BC;
    --accent:#C1443A;
    --accent-ink:#FFFFFF;
    --unlocked:#2F7566;
    --unlocked-soft:#DCEAE4;
    --locked:#C9C2B2;
    --locked-soft:#EFEAE0;
    --gold:#B4842E;
    --gold-soft:#F1E4C6;
    --shadow:0 10px 30px -14px rgba(35,40,58,.28);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161A24;
      --paper:#1E2330;
      --ink:#EDE8D8;
      --ink-soft:#B4AE9B;
      --line:#3A3F4E;
      --accent:#E2665C;
      --accent-ink:#1B1410;
      --unlocked:#4FA593;
      --unlocked-soft:#233833;
      --locked:#3A3F4E;
      --locked-soft:#262B38;
      --gold:#D9B35F;
      --gold-soft:#332B18;
      --shadow:0 10px 34px -14px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
      --bg:#161A24;
      --paper:#1E2330;
      --ink:#EDE8D8;
      --ink-soft:#B4AE9B;
      --line:#3A3F4E;
      --accent:#E2665C;
      --accent-ink:#1B1410;
      --unlocked:#4FA593;
      --unlocked-soft:#233833;
      --locked:#3A3F4E;
      --locked-soft:#262B38;
      --gold:#D9B35F;
      --gold-soft:#332B18;
      --shadow:0 10px 34px -14px rgba(0,0,0,.55);
      color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', -apple-system, 'Pretendard', sans-serif;
    padding-inline:16px;
    padding-block:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 28px);
    max-width:560px;
    margin-inline:auto;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  h1,h2,h3{font-family:'Noto Serif KR', 'Noto Sans KR', serif; margin:0; text-wrap:balance;}
  .mono{font-family:'Space Mono','Noto Sans KR',monospace;}
  button{font:inherit; cursor:pointer;}
  p{margin:0;}

  /* ---------- header ---------- */
  header{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    background:var(--bg);
    padding-block:10px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .stamp-mark{
    width:38px; height:38px; border-radius:50%;
    border:2px solid var(--accent); color:var(--accent);
    display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif KR',serif; font-weight:700; font-size:15px;
    transform:rotate(-8deg);
    flex:none;
  }
  .brand h1{font-size:19px; line-height:1.15;}
  .brand .sub{font-size:11px; color:var(--ink-soft); letter-spacing:.04em;}
  .progress-pill{
    display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:none;
  }
  .progress-pill .num{font-family:'Space Mono',monospace; font-size:15px; font-weight:700;}
  .progress-track{width:78px; height:5px; border-radius:3px; background:var(--locked-soft); overflow:hidden;}
  .progress-fill{height:100%; background:var(--accent); border-radius:3px; transition:width .4s ease;}

  .devbar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:11px; color:var(--ink-soft);
  }
  .devtoggle{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    border-radius:999px; padding:4px 10px; font-size:11px;
  }
  .devtoggle[aria-pressed="true"]{ background:var(--gold-soft); color:var(--gold); border-color:var(--gold); font-weight:700; }
  .devpanel{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    background:var(--gold-soft); border:1px dashed var(--gold); border-radius:10px;
    padding:8px 10px; font-size:12px; color:var(--ink);
  }
  .devpanel select{
    font:inherit; padding:4px 6px; border-radius:6px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink);
  }

  /* ---------- map ---------- */
  .map-card{
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:10px 6px 4px; box-shadow:var(--shadow);
  }
  svg#map{ width:100%; height:auto; display:block; }
  .region-path{
    stroke:var(--paper); stroke-width:1.4; cursor:pointer;
    transition:filter .15s ease, transform .15s ease;
    fill:var(--locked);
  }
  .region-path:hover{ filter:brightness(1.08); }
  .region-path.unlocked{ fill:var(--unlocked); }
  .region-path.home{ fill:var(--accent); }
  .region-path.selected{ stroke:var(--ink); stroke-width:2.4; }
  .badge-dot{ pointer-events:none; }

  .legend{
    display:flex; gap:14px; flex-wrap:wrap; padding:8px 10px 10px; font-size:11px; color:var(--ink-soft);
  }
  .legend span{display:inline-flex; align-items:center; gap:5px;}
  .swatch{width:10px; height:10px; border-radius:3px; display:inline-block;}

  /* ---------- onboarding ---------- */
  .onboard{
    background:var(--paper); border:1px solid var(--line); border-radius:18px;
    padding:22px 18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
  }
  .onboard h2{font-size:22px;}
  .onboard p{color:var(--ink-soft); font-size:13.5px; line-height:1.6;}
  .btn{
    border:none; border-radius:12px; padding:13px 16px; font-size:14.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-secondary{ background:var(--paper); color:var(--ink); border:1.5px solid var(--line); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); text-decoration:underline; padding:8px; font-size:13px; font-weight:500;}
  .btn:active{ transform:translateY(1px); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .status-line{font-size:12.5px; color:var(--ink-soft); min-height:16px;}

  /* ---------- sheet / modal ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(20,18,12,.42);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; padding:0;
  }
  .sheet{
    width:100%; max-width:560px; background:var(--paper);
    border-radius:20px 20px 0 0; box-shadow:var(--shadow);
    max-height:88vh; overflow-y:auto;
    padding:16px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    display:flex; flex-direction:column; gap:14px;
    animation:sheet-up .22s ease;
  }
  @keyframes sheet-up{ from{ transform:translateY(16px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .sheet{animation:none;} }
  .sheet-handle{ width:36px; height:4px; border-radius:2px; background:var(--line); margin:0 auto; }
  .sheet-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .sheet-head h2{ font-size:20px; }
  .close-x{
    background:var(--locked-soft); color:var(--ink-soft); border:none; border-radius:50%;
    width:30px; height:30px; font-size:15px; flex:none;
  }
  .region-tag{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:999px; width:fit-content;
  }
  .tag-locked{ background:var(--locked-soft); color:var(--ink-soft); }
  .tag-unlocked{ background:var(--unlocked-soft); color:var(--unlocked); }
  .tag-home{ background:var(--gold-soft); color:var(--gold); }

  .coord{ font-size:11px; color:var(--ink-soft); }

  .divider{ height:1px; background:var(--line); border:none; margin:2px 0; }

  /* mission */
  .mission-box{
    background:var(--locked-soft); border-radius:12px; padding:12px; font-size:13px; color:var(--ink-soft); line-height:1.55;
  }
  textarea{
    width:100%; min-height:74px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--bg); color:var(--ink); padding:10px; font:inherit; font-size:13.5px; resize:vertical;
  }
  .file-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--ink-soft); }
  .photo-preview{ width:52px; height:52px; border-radius:8px; object-fit:cover; border:1px solid var(--line); }

  /* feed */
  .feed{ display:flex; flex-direction:column; gap:10px; }
  .post{
    display:flex; gap:10px; padding:10px; border:1px solid var(--line); border-radius:12px; background:var(--bg);
  }
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--unlocked-soft); color:var(--unlocked);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none;
  }
  .post .who{ font-size:12.5px; font-weight:700; }
  .post .when{ font-size:10.5px; color:var(--ink-soft); font-weight:400; margin-left:6px; }
  .post .text{ font-size:13px; line-height:1.5; margin-top:2px; }
  .post img.photo{ margin-top:6px; width:100%; max-height:160px; object-fit:cover; border-radius:8px; }
  .empty-note{ font-size:12.5px; color:var(--ink-soft); padding:10px 2px; }

  /* decorate */
  .grid4{
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
  }
  .cell{
    aspect-ratio:1; border-radius:10px; background:var(--locked-soft); border:1px dashed var(--line);
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .cell.filled{ background:var(--unlocked-soft); border-style:solid; border-color:var(--unlocked); }
  .palette{ display:flex; gap:8px; flex-wrap:wrap; }
  .pal-item{
    width:44px; height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg);
    font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  .pal-item[aria-pressed="true"]{ border-color:var(--accent); background:var(--gold-soft); }
  .pal-item.eraser{ font-size:14px; color:var(--ink-soft); }

  .stat-row{ display:flex; gap:8px; }
  .stat-tile{
    flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  }
  .stat-tile .v{ font-family:'Space Mono',monospace; font-weight:700; font-size:16px; }
  .stat-tile .l{ font-size:10.5px; color:var(--ink-soft); }

  /* toast */
  #toast-wrap{ position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; justify-content:center; z-index:80; pointer-events:none;}
  .toast{
    background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; animation:toast-in .25s ease;
  }
  @keyframes toast-in{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  footer{ text-align:center; font-size:11px; color:var(--ink-soft); padding-top:4px; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">

<header>
  <div class="brand">
    <div class="stamp-mark">KR</div>
    <div>
      <h1>코리아 트래블러</h1>
      <div class="sub">여행하며 대한민국을 채워가는 지도</div>
    </div>
  </div>
  <div class="progress-pill">
    <div class="num"><span id="unlockedCount">0</span><span style="color:var(--ink-soft); font-weight:400;">/17</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
</header>

<div class="devbar">
  <span>실제 여행이 어려울 땐 테스트 모드로 미리 체험해보세요.</span>
  <button class="devtoggle" id="devToggle" aria-pressed="false">🧪 테스트 모드</button>
</div>
<div class="devpanel" id="devPanel" hidden>
  <span>가상 위치:</span>
  <select id="devSelect"></select>
  <button class="btn btn-secondary" id="devApply" style="padding:6px 12px; font-size:12px;">이 위치로 이동</button>
</div>

<main id="onboard" class="onboard">
  <h2>여행 여권을 펼쳐보세요</h2>
  <p>
    처음에는 현재 위치한 지역 외 16개 지역이 모두 잠겨 있어요. 실제로 그 지역에 방문해서 미션(커뮤니티 포스트 작성)을 완료하면
    지도가 열리고, 열린 지역 위에는 나만의 가상 건물을 지어 꾸밀 수 있어요.
  </p>
  <button class="btn btn-primary" id="btnLocate">📍 내 위치로 시작하기</button>
  <button class="btn btn-ghost" id="btnDevStart">위치 권한 없이 테스트 모드로 시작하기</button>
  <p class="status-line" id="onboardStatus"></p>
</main>

<section class="map-card" id="mapCard" hidden>
  <svg id="map" viewBox="0 0 800 900" role="img" aria-label="대한민국 지도"></svg>
  <div class="legend">
    <span><i class="swatch" style="background:var(--accent)"></i>내 홈 지역</span>
    <span><i class="swatch" style="background:var(--unlocked)"></i>잠금 해제</span>
    <span><i class="swatch" style="background:var(--locked)"></i>잠김</span>
  </div>
</section>

<footer>실제 위치 정보는 이 기기에만 저장되며 다른 사람에게 전송되지 않아요.</footer>

<script>
(function(){
  "use strict";
  var STATE_KEY = "kr-traveler-state-v1";
  var GRID_N = 4; // 4x4 decorate grid
  var BUILDINGS = [
    {id:"house", icon:"🏠", name:"집"},
    {id:"landmark", icon:"🏯", name:"랜드마크"},
    {id:"cafe", icon:"☕", name:"카페"},
    {id:"park", icon:"🌳", name:"공원"},
    {id:"tower", icon:"🏢", name:"타워"},
    {id:"plaza", icon:"⛲", name:"광장"},
    {id:"market", icon:"🏮", name:"시장"},
    {id:"temple", icon:"⛩️", name:"사찰"}
  ];
  var SEED_NAMES = ["여행자민지","길위의준호","떠도는하늘","지도채우기","가을바람","나침반유리"];

  function seedPosts(code){
    // deterministic-ish pseudo random pick based on code so it's stable across renders
    var seedTexts = [
      "여기 야경 진짜 최고예요 🌃 다들 꼭 들러보세요!",
      "로컬 맛집 하나 발견! 다음에 또 오고 싶다 😋",
      "미션 완료 도장 쾅! 다음 지역으로 출발합니다 🧭",
      "생각보다 볼거리가 많아서 놀랐어요.",
      "날씨 좋은 날 산책하기 딱이었어요 ☀️"
    ];
    var n = 1 + (parseInt(code,10) % 2);
    var out = [];
    for (var i=0;i<n;i++){
      var idx = (parseInt(code,10)+i) % seedTexts.length;
      var who = SEED_NAMES[(parseInt(code,10)+i*3) % SEED_NAMES.length];
      out.push({who:who, text:seedTexts[idx], when:"예시", seed:true});
    }
    return out;
  }

  /* ---------------- state ---------------- */
  function loadState(){
    try{
      var raw = localStorage.getItem(STATE_KEY);
      if (raw) return JSON.parse(raw);
    }catch(e){}
    return { home:null, unlocked:[], posts:{}, buildings:{} };
  }
  function saveState(){
    try{ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }catch(e){}
  }
  var state = (window.claude && window.claude.hot && window.claude.hot.data) ? window.claude.hot.data : loadState();
  if (!state || typeof state !== "object") state = { home:null, unlocked:[], posts:{}, buildings:{} };
  state.unlocked = state.unlocked || [];
  state.posts = state.posts || {};
  state.buildings = state.buildings || {};

  if (window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){ return state; });
  }

  /* ---------------- geo helpers ---------------- */
  function pointInRing(pt, ring){
    var x = pt[0], y = pt[1], inside = false;
    for (var i=0, j=ring.length-1; i<ring.length; j=i++){
      var xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1];
      var intersect = ((yi>y) !== (yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
      if (intersect) inside = !inside;
    }
    return inside;
  }
  function pointInPolys(pt, polys){
    // even-odd across all rings of all polygons (handles holes reasonably)
    for (var p=0;p<polys.length;p++){
      var poly = polys[p];
      var inOuter = pointInRing(pt, poly[0]);
      if (!inOuter) continue;
      var inHole = false;
      for (var r=1;r<poly.length;r++){ if (pointInRing(pt, poly[r])) { inHole = true; break; } }
      if (inOuter && !inHole) return true;
    }
    return false;
  }
  function findRegionForPoint(lon, lat){
    var best = null;
    for (var i=0;i<REGIONS.regions.length;i++){
      var r = REGIONS.regions[i];
      var b = r.bbox;
      if (lon < b[0] || lon > b[2] || lat < b[1] || lat > b[3]) continue;
      if (pointInPolys([lon,lat], r.polys)) { best = r; break; }
    }
    return best;
  }
  function regionByCode(code){
    for (var i=0;i<REGIONS.regions.length;i++) if (REGIONS.regions[i].code === code) return REGIONS.regions[i];
    return null;
  }

  /* ---------------- toast ---------------- */
  function toast(msg, icon){
    var wrap = document.getElementById("toast-wrap");
    var el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = "<span>"+(icon||"✅")+"</span><span></span>";
    el.querySelector("span:last-child").textContent = msg;
    wrap.appendChild(el);
    setTimeout(function(){ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(function(){ el.remove(); }, 300); }, 2200);
  }

  /* ---------------- map render ---------------- */
  var svg = document.getElementById("map");
  function buildMap(){
    var parts = [];
    for (var i=0;i<REGIONS.regions.length;i++){
      var r = REGIONS.regions[i];
      parts.push('<path class="region-path" data-code="'+r.code+'" d="'+r.d+'"></path>');
    }
    svg.innerHTML = parts.join("");
    Array.prototype.forEach.call(svg.querySelectorAll(".region-path"), function(p){
      p.addEventListener("click", function(){ openRegion(p.getAttribute("data-code")); });
    });
    renderMap();
  }
  function renderMap(){
    var unlockedCount = state.unlocked.length;
    document.getElementById("unlockedCount").textContent = unlockedCount;
    document.getElementById("progressFill").style.width = Math.round(unlockedCount/17*100)+"%";
    Array.prototype.forEach.call(svg.querySelectorAll(".region-path"), function(p){
      var code = p.getAttribute("data-code");
      p.classList.toggle("unlocked", state.unlocked.indexOf(code) !== -1 && code !== state.home);
      p.classList.toggle("home", code === state.home);
      p.classList.toggle("selected", code === selectedCode);
    });
  }

  /* ---------------- onboarding / geolocation ---------------- */
  var onboardStatus = document.getElementById("onboardStatus");
  var devMode = false;
  var simulatedPoint = null; // [lon,lat] when in dev mode

  function currentPositionAsync(){
    return new Promise(function(resolve){
      if (devMode && simulatedPoint){ resolve({coords:{longitude:simulatedPoint[0], latitude:simulatedPoint[1]}}); return; }
      // Native app build (Capacitor): use the native Geolocation plugin so the
      // OS-level permission prompt and GPS hardware are used correctly.
      var capGeo = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation;
      if (capGeo && capGeo.getCurrentPosition){
        capGeo.getCurrentPosition({ enableHighAccuracy:true, timeout:8000 })
          .then(function(pos){ resolve(pos); })
          .catch(function(){ resolve(null); });
        return;
      }
      // Web/preview build: standard browser Geolocation API.
      if (!("geolocation" in navigator)){ resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        function(pos){ resolve(pos); },
        function(){ resolve(null); },
        { enableHighAccuracy:true, timeout:8000, maximumAge:60000 }
      );
    });
  }

  function startWithHome(code){
    state.home = code;
    if (state.unlocked.indexOf(code) === -1) state.unlocked.push(code);
    saveState();
    document.getElementById("onboard").hidden = true;
    document.getElementById("mapCard").hidden = false;
    buildMap();
    var r = regionByCode(code);
    toast((r?r.name:"현재 지역")+" 잠금 해제! 여행을 시작해보세요", "🎉");
  }

  document.getElementById("btnLocate").addEventListener("click", function(){
    onboardStatus.textContent = "위치를 확인하는 중...";
    currentPositionAsync().then(function(pos){
      if (!pos){
        onboardStatus.textContent = "위치를 가져오지 못했어요. 권한을 허용했는지 확인하거나 테스트 모드를 사용해주세요.";
        return;
      }
      var r = findRegionForPoint(pos.coords.longitude, pos.coords.latitude);
      if (!r){
        onboardStatus.textContent = "대한민국 영역 밖으로 확인됐어요. 테스트 모드로 시작해볼까요?";
        return;
      }
      onboardStatus.textContent = "";
      startWithHome(r.code);
    });
  });

  document.getElementById("btnDevStart").addEventListener("click", function(){
    setDevMode(true);
    document.getElementById("devPanel").hidden = false;
    onboardStatus.textContent = "아래 테스트 패널에서 지역을 선택하고 '이 위치로 이동'을 눌러주세요.";
    document.getElementById("devPanel").scrollIntoView({behavior:"smooth", block:"center"});
  });

  /* ---------------- dev mode ---------------- */
  var devToggle = document.getElementById("devToggle");
  var devPanel = document.getElementById("devPanel");
  var devSelect = document.getElementById("devSelect");
  REGIONS.regions.slice().sort(function(a,b){ return a.name.localeCompare(b.name,"ko"); }).forEach(function(r){
    var opt = document.createElement("option");
    opt.value = r.code; opt.textContent = r.name;
    devSelect.appendChild(opt);
  });
  function setDevMode(v){
    devMode = v;
    devToggle.setAttribute("aria-pressed", v ? "true":"false");
    devPanel.hidden = !v;
  }
  devToggle.addEventListener("click", function(){ setDevMode(!devMode); });
  document.getElementById("devApply").addEventListener("click", function(){
    var code = devSelect.value;
    var r = regionByCode(code);
    // use bbox center as a reliable interior-ish approximation, refine by testing centroid too
    var lon = (r.bbox[0]+r.bbox[2])/2, lat = (r.bbox[1]+r.bbox[3])/2;
    if (!pointInPolys([lon,lat], r.polys)){
      // fall back to first polygon's first ring average point
      var ring = r.polys[0][0];
      lon = 0; lat = 0;
      ring.forEach(function(pt){ lon += pt[0]; lat += pt[1]; });
      lon /= ring.length; lat /= ring.length;
    }
    simulatedPoint = [lon, lat];
    if (document.getElementById("onboard").hidden === false){
      startWithHome(code);
    } else {
      toast(r.name+"(으)로 이동했어요. 지도에서 확인해보세요.", "🧭");
      if (selectedCode) openRegion(selectedCode);
    }
  });

  /* ---------------- sheet ---------------- */
  var selectedCode = null;
  var scrimEl = null;
  function closeSheet(){
    if (scrimEl){ scrimEl.remove(); scrimEl = null; }
    selectedCode = null;
    renderMap();
  }
  function openSheet(html){
    if (scrimEl) scrimEl.remove();
    scrimEl = document.createElement("div");
    scrimEl.className = "scrim";
    scrimEl.innerHTML = '<div class="sheet"><div class="sheet-handle"></div>'+html+'</div>';
    scrimEl.addEventListener("click", function(e){ if (e.target === scrimEl) closeSheet(); });
    document.body.appendChild(scrimEl);
  }

  function openRegion(code){
    selectedCode = code;
    renderMap();
    var r = regionByCode(code);
    var isHome = code === state.home;
    var isUnlocked = state.unlocked.indexOf(code) !== -1;

    if (!isUnlocked){
      renderLockedSheet(r);
    } else {
      renderUnlockedSheet(r, isHome);
    }
  }

  function renderLockedSheet(r){
    var html =
      '<div class="sheet-head"><div>'+
        '<span class="region-tag tag-locked">🔒 잠김</span>'+
        '<h2 style="margin-top:6px;">'+r.name+'</h2>'+
        '<div class="coord mono">'+r.name_eng+'</div>'+
      '</div><button class="close-x" id="closeBtn">✕</button></div>'+
      '<p style="color:var(--ink-soft); font-size:13px; line-height:1.6;">이 지역은 아직 방문하지 않았어요. 실제로 이 지역에 가서 확인하면 미션을 시작할 수 있어요.</p>'+
      '<button class="btn btn-secondary" id="checkHereBtn">🧭 지금 여기 있는지 확인하기</button>'+
      '<p class="status-line" id="lockedStatus"></p>'+
      '<div id="missionSlot"></div>';
    openSheet(html);
    document.getElementById("closeBtn").addEventListener("click", closeSheet);
    document.getElementById("checkHereBtn").addEventListener("click", function(){
      var statusEl = document.getElementById("lockedStatus");
      statusEl.textContent = "위치 확인 중...";
      currentPositionAsync().then(function(pos){
        if (!pos){ statusEl.textContent = "위치를 가져오지 못했어요. 테스트 모드를 사용해보세요."; return; }
        var here = findRegionForPoint(pos.coords.longitude, pos.coords.latitude);
        if (here && here.code === r.code){
          statusEl.textContent = "";
          renderMissionForm(r);
        } else {
          statusEl.textContent = (here? "현재 "+here.name+"에 계신 것으로 확인돼요." : "대한민국 영역 밖으로 확인됐어요.") + " "+r.name+"에 도착하면 다시 확인해주세요.";
        }
      });
    });
  }

  function renderMissionForm(r){
    var slot = document.getElementById("missionSlot");
    slot.innerHTML =
      '<hr class="divider">'+
      '<div class="mission-box">📍 도착 확인 완료! 미션: <b>커뮤니티 포스트 작성</b><br>이 지역에서의 순간을 짧은 글(+사진)로 남기면 지역이 잠금 해제돼요.</div>'+
      '<textarea id="postText" placeholder="'+r.name+'에서의 순간을 적어보세요..." maxlength="300"></textarea>'+
      '<div class="file-row"><label for="postPhoto">📷 사진 추가(선택)</label><input type="file" id="postPhoto" accept="image/*"><img id="photoPreview" class="photo-preview" hidden></div>'+
      '<button class="btn btn-primary" id="submitPostBtn">✅ 포스트 올리고 잠금 해제</button>';
    var photoData = null;
    document.getElementById("postPhoto").addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        var tmpImg = new Image();
        tmpImg.onload = function(){
          var maxW = 480;
          var scale = Math.min(1, maxW / tmpImg.width);
          var cw = Math.max(1, Math.round(tmpImg.width*scale));
          var ch = Math.max(1, Math.round(tmpImg.height*scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw; canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(tmpImg, 0, 0, cw, ch);
          try{ photoData = canvas.toDataURL("image/jpeg", 0.72); }
          catch(err){ photoData = ev.target.result; }
          var img = document.getElementById("photoPreview");
          img.src = photoData; img.hidden = false;
        };
        tmpImg.onerror = function(){
          photoData = ev.target.result;
          var img = document.getElementById("photoPreview");
          img.src = photoData; img.hidden = false;
        };
        tmpImg.src = ev.target.result;
      };
      reader.readAsDataURL(f);
    });
    document.getElementById("submitPostBtn").addEventListener("click", function(){
      var text = document.getElementById("postText").value.trim();
      if (!text){ document.getElementById("postText").focus(); return; }
      addPost(r.code, text, photoData);
      if (state.unlocked.indexOf(r.code) === -1) state.unlocked.push(r.code);
      saveState();
      buildMap();
      closeSheet();
      toast(r.name+" 잠금 해제! 이제 건물을 지어보세요", "🎉");
    });
  }

  function addPost(code, text, photo){
    state.posts[code] = state.posts[code] || [];
    state.posts[code].unshift({ who:"나", text:text, photo:photo||null, when:new Date().toLocaleDateString("ko-KR"), mine:true });
    saveState();
  }

  function renderUnlockedSheet(r, isHome){
    var buildings = state.buildings[r.code] || [];
    var placedCount = buildings.filter(Boolean).length;
    var myPosts = state.posts[r.code] || [];
    var feed = myPosts.concat(seedPosts(r.code));
    var feedHtml = feed.map(function(p){
      return '<div class="post"><div class="avatar">'+(p.mine?"나":p.who.slice(0,1))+'</div><div style="flex:1; min-width:0;">'+
        '<span class="who">'+(p.mine?"나":p.who)+'</span><span class="when">'+p.when+'</span>'+
        '<div class="text">'+escapeHtml(p.text)+'</div>'+
        (p.photo? '<img class="photo" src="'+p.photo+'">':'')+
      '</div></div>';
    }).join("");

    var html =
      '<div class="sheet-head"><div>'+
        '<span class="region-tag '+(isHome?'tag-home':'tag-unlocked')+'">'+(isHome?'🏡 내 홈 지역':'🔓 잠금 해제됨')+'</span>'+
        '<h2 style="margin-top:6px;">'+r.name+'</h2>'+
        '<div class="coord mono">'+r.name_eng+'</div>'+
      '</div><button class="close-x" id="closeBtn">✕</button></div>'+
      '<div class="stat-row">'+
        '<div class="stat-tile"><div class="v">'+myPosts.length+'</div><div class="l">내 포스트</div></div>'+
        '<div class="stat-tile"><div class="v">'+placedCount+'</div><div class="l">건물 수</div></div>'+
      '</div>'+
      '<button class="btn btn-secondary" id="decorateBtn">🏗️ 이 지역 꾸미기</button>'+
      '<hr class="divider">'+
      '<h3 style="font-size:14px;">커뮤니티 피드</h3>'+
      (feed.length? '<div class="feed">'+feedHtml+'</div>' : '<p class="empty-note">아직 포스트가 없어요.</p>')+
      '<textarea id="extraPostText" placeholder="이 지역에 포스트 추가로 남기기..." maxlength="300"></textarea>'+
      '<button class="btn btn-secondary" id="extraPostBtn">✏️ 포스트 남기기</button>';
    openSheet(html);
    document.getElementById("closeBtn").addEventListener("click", closeSheet);
    document.getElementById("decorateBtn").addEventListener("click", function(){ renderDecorateSheet(r); });
    document.getElementById("extraPostBtn").addEventListener("click", function(){
      var t = document.getElementById("extraPostText").value.trim();
      if (!t) return;
      addPost(r.code, t, null);
      toast("포스트를 남겼어요", "📝");
      renderUnlockedSheet(r, isHome);
    });
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
  }

  function renderDecorateSheet(r){
    var buildings = state.buildings[r.code] || new Array(GRID_N*GRID_N).fill(null);
    var selectedBuilding = null;
    var html =
      '<div class="sheet-head"><div>'+
        '<h2>'+r.name+' 꾸미기</h2>'+
        '<div class="coord">칸을 눌러 건물을 배치하거나 지워보세요</div>'+
      '</div><button class="close-x" id="closeBtn">✕</button></div>'+
      '<div class="palette" id="palette"></div>'+
      '<div class="grid4" id="grid"></div>'+
      '<button class="btn btn-primary" id="backBtn">← 지역 정보로 돌아가기</button>';
    openSheet(html);
    document.getElementById("closeBtn").addEventListener("click", closeSheet);
    document.getElementById("backBtn").addEventListener("click", function(){ renderUnlockedSheet(r, r.code===state.home); });

    var palEl = document.getElementById("palette");
    BUILDINGS.forEach(function(b){
      var btn = document.createElement("button");
      btn.className = "pal-item"; btn.setAttribute("aria-pressed","false"); btn.textContent = b.icon; btn.title = b.name;
      btn.addEventListener("click", function(){
        selectedBuilding = (selectedBuilding===b.id) ? null : b.id;
        Array.prototype.forEach.call(palEl.children, function(c){ c.setAttribute("aria-pressed","false"); });
        if (selectedBuilding) btn.setAttribute("aria-pressed","true");
      });
      palEl.appendChild(btn);
    });
    var eraser = document.createElement("button");
    eraser.className = "pal-item eraser"; eraser.setAttribute("aria-pressed","false"); eraser.textContent = "지우기";
    eraser.addEventListener("click", function(){
      selectedBuilding = (selectedBuilding==="__erase__") ? null : "__erase__";
      Array.prototype.forEach.call(palEl.children, function(c){ c.setAttribute("aria-pressed","false"); });
      if (selectedBuilding) eraser.setAttribute("aria-pressed","true");
    });
    palEl.appendChild(eraser);

    var gridEl = document.getElementById("grid");
    function renderGrid(){
      gridEl.innerHTML = "";
      for (var i=0;i<GRID_N*GRID_N;i++){
        var cellVal = buildings[i];
        var cell = document.createElement("button");
        cell.className = "cell" + (cellVal? " filled":"");
        var b = cellVal ? BUILDINGS.filter(function(x){return x.id===cellVal;})[0] : null;
        cell.textContent = b ? b.icon : "";
        (function(idx){
          cell.addEventListener("click", function(){
            if (selectedBuilding === "__erase__"){ buildings[idx] = null; }
            else if (selectedBuilding){ buildings[idx] = selectedBuilding; }
            else { return; }
            state.buildings[r.code] = buildings;
            saveState();
            renderGrid();
          });
        })(i);
        gridEl.appendChild(cell);
      }
    }
    renderGrid();
  }

  /* ---------------- boot ---------------- */
  if (state.home){
    document.getElementById("onboard").hidden = true;
    document.getElementById("mapCard").hidden = false;
    buildMap();
  }
})();
</script>

</body>
</html>
